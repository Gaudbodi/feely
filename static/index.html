<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse | Feely.ai</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- Auth View -->
    <div id="auth-view" class="container flex-center" style="min-height: 100vh;">
        <div class="card animate-in" style="max-width: 400px; width: 100%; text-align: center;">
            <div class="mascot-container">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="45" fill="#6366f1" fill-opacity="0.1"/>
                    <path d="M30 50C30 38.9543 38.9543 30 50 30C61.0457 30 70 38.9543 70 50C70 61.0457 61.0457 70 50 70C38.9543 70 30 61.0457 30 50Z" fill="#6366f1"/>
                    <circle cx="42" cy="45" r="3" fill="white"/>
                    <circle cx="58" cy="45" r="3" fill="white"/>
                    <path d="M42 58C42 58 45 62 50 62C55 62 58 58 58 58" stroke="white" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
            <h1 id="auth-title">Welcome Back</h1>
            <p id="auth-subtitle" style="color: var(--text-muted); margin-bottom: 2rem;">Monitor your vitals with Pulse.</p>
            
            <form id="auth-form" style="text-align: left;">
                <div style="margin-bottom: 1rem;">
                    <label style="font-size: 0.9rem; font-weight: 500; display: block; margin-bottom: 0.5rem;">Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>
                <div style="margin-bottom: 2rem;">
                    <label style="font-size: 0.9rem; font-weight: 500; display: block; margin-bottom: 0.5rem;">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary" id="auth-submit">Sign In</button>
            </form>

            <div style="margin-top: 1.5rem; border-top: 1px solid #eee; paddingTop: 1.5rem;">
                <p style="font-size: 0.9rem; color: var(--text-muted); margin-top: 1rem;">
                    <span id="auth-toggle-text">Don't have an account?</span>
                    <button class="btn-link" id="auth-toggle-btn">Sign Up</button>
                </p>
            </div>
        </div>
    </div>

    <!-- Dashboard View -->
    <div id="dashboard-view" class="container hidden">
        <header class="animate-in">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <div style="width: 50px; height: 50px;">
                    <svg viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="45" fill="#6366f1" fill-opacity="0.1"/>
                        <circle cx="50" cy="50" r="25" fill="#6366f1"/>
                    </svg>
                </div>
                <div>
                    <h1 id="user-greeting" style="font-size: 1.5rem;">Hello!</h1>
                    <p style="color: var(--text-muted); font-size: 0.9rem;">Welcome back to Feely.ai</p>
                </div>
            </div>
            <button id="logout-btn" style="color: var(--error); background: none; font-weight: 600;">Logout</button>
        </header>

        <div class="stats-grid">
            <div class="card animate-in stagger-1">
                <h2 style="margin-bottom: 1.5rem; font-size: 1.2rem;">New Reading</h2>
                <form id="reading-form">
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 1rem; margin-bottom: 1rem;">
                        <div>
                            <label style="font-size: 0.8rem; font-weight: 500; display: block; margin-bottom: 0.3rem;">Systolic</label>
                            <input type="number" id="reading-systolic" placeholder="120" required>
                        </div>
                        <div>
                            <label style="font-size: 0.8rem; font-weight: 500; display: block; margin-bottom: 0.3rem;">Diastolic</label>
                            <input type="number" id="reading-diastolic" placeholder="80" required>
                        </div>
                        <div>
                            <label style="font-size: 0.8rem; font-weight: 500; display: block; margin-bottom: 0.3rem;">BPM</label>
                            <input type="number" id="reading-bpm" placeholder="72">
                        </div>
                        <div>
                            <label style="font-size: 0.8rem; font-weight: 500; display: block; margin-bottom: 0.3rem;">Date & Time</label>
                            <input type="datetime-local" id="reading-date">
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">Save Reading</button>
                </form>
            </div>

            <div class="card animate-in stagger-2">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h2 style="font-size: 1.2rem;">Health Trends</h2>
                    <div class="filter-group" style="display: flex; gap: 0.5rem;">
                        <button class="btn-filter active" data-filter="all">All</button>
                        <button class="btn-filter" data-filter="systolic">Systolic</button>
                        <button class="btn-filter" data-filter="diastolic">Diastolic</button>
                    </div>
                </div>
                <div id="no-data" class="flex-center" style="height: 250px; flex-direction: column; color: var(--text-muted);">
                    <p>No readings yet. Add your first one!</p>
                </div>
                <div style="height: 300px; width: 100%;">
                    <canvas id="healthChart" class="hidden"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
